name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build and Deploy Docusaurus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Checkout existing GitHub Pages output
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous-pages
          token: ${{ secrets.GH_PAT_PAGES }}

      - name: Preserve generated API reference
        run: |
          if [ -d previous-pages/api ]; then
            mkdir -p build/api
            cp -R previous-pages/api/. build/api/
          fi

      - name: Copy CNAME
        run: cp CNAME build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT_PAGES }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
